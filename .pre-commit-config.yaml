# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.17
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      # Keep uv.lock in sync with pyproject.toml
      - id: uv-lock
      # Export requirements.txt from uv.lock (ensures lockfile parity, unlike `uv pip compile`)
      - id: uv-export
        args: ["--frozen", "--no-dev", "--no-emit-project", "--no-hashes", "--output-file=requirements.txt", "--quiet"]
        files: ^(uv\.lock|pyproject\.toml)$
